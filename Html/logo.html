<!DOCTYPE html>
<html lang="pt-br">
 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="../Css/logo.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <script href="../logo.js"></script>

    <title>SweetProfit</title>
</head>

<body>
    <div class="Conteiner-log">
        <img class="logo" src="../images/logo.png" alt="imagem do logo">

        <h1>SweetProfit</h1>

        <p>Gestão financeira para sua confeitaria</p>
    </div>

    <div class="container">

        <h1 class="title">Bem-vindo(a)!</h1>
        <form>
            <div class="input">
                <label class="important">E-mail:</label>
                <input type="email" id="email" placeholder="email" required>
            </div>

            <div class="input">
                <label class="important" for="senha">Senha: <span class="forgot-password"><a
                            href="../Html/remember.html">Esqueceu a senha?</a></span></label>
                <input type="password" id="senha" placeholder="senha" required>
            </div>

            <div class="remember">
                <input type="checkbox" id="remember">
                <label class="rmb">Lembrar-me</label>

            </div>

            <button type="submit" class="login-btn">Entrar</button>

            <div class="line"><span>ou continue com</span></div>

            <div class="social">
                <button type="submit"><img src="../images/gmail.png">Login com Google</button>
                <button><img src="../images/facebook.png">Login com Facebook</button>

            </div>
        </form>

    </div>
    <div class="signup">
        Não tem uma conta? <a class="link" href="../Html/register.html">Cadastre-se</a>
    </div>

</body>

</html>
